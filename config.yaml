# relayTTS daemon configuration.
#
# Voices and per-voice delivery (`instruct`) are externalized here so they can be
# tuned without touching daemon code. The daemon reads this once at startup
# (override the path with the RELAYTTS_CONFIG env var).
#
# Engine: the daemon owns no model. Every synthesis is an OpenAI-compatible
# POST to engine.remote.base_url/audio/speech. `speaker` (below, per voice) is
# the remote server's CustomVoice speaker id; `instruct` is that voice's
# default emotion/delivery. A per-request `instruct` overrides the voice
# default. The remote server's `speed=` is treated as a no-op, so the daemon
# applies a pitch-preserving ffmpeg time-stretch for any speed != 1.0.

engine:
  sample_rate: 24000
  lang_code: english
  temperature: 0.9

  # Remote inference endpoint — required. base_url and model are deployment
  # facts, not source, so they are left blank here and set per machine via
  # RELAYTTS_REMOTE_URL / RELAYTTS_REMOTE_MODEL (which override base_url/model
  # below on their own). `model` is the id the remote server exposes, which
  # need not match any local name; a router may prefix or alias its upstreams.
  # If an LLM router fronts the inference server, point base_url at the
  # router: it can hold the upstream credential, so no token has to live
  # beside the daemon.
  #
  # Transport security is fail-closed: https is required for any non-loopback
  # base_url. ca_file, when set, is the ONLY trust anchor (system roots are
  # not consulted alongside it) — the natural choice is relay's local CA at
  # ~/Library/Application Support/Relay/ca.crt for relay-issued certificates.
  # pin_sha256 additionally requires the leaf certificate's SHA-256
  # fingerprint to match (comma-separated for multiple, colons optional). Get
  # a fingerprint with:
  #
  #   openssl s_client -connect host:port </dev/null 2>/dev/null | openssl x509 -fingerprint -sha256 -noout
  #
  # There is no skip-verify / insecure flag, by design.
  #
  #   base_url: https://198.51.100.10:8080/v1
  #   model: my-router/qwen3-tts-customvoice
  #   clone_model: my-router/qwen3-tts-base
  #   ca_file: /Users/me/Library/Application Support/Relay/ca.crt
  #   pin_sha256: ""
  #
  remote:
    base_url: ""
    model: ""
    clone_model: ""
    timeout: 120
    ca_file: ""
    pin_sha256: ""
    # Name of the env var holding a bearer token, if the endpoint needs one.
    # The token itself is never written here.
    api_key_env: RELAYTTS_REMOTE_API_KEY

# Directory clone voices' `ref_audio` must resolve inside (relative paths in
# voices.json are joined onto it). Default: `clone-audio` beside this file.
clone_audio_dir: clone-audio

# Voice used when a request omits `voice` or sends an unknown id.
default_voice: anna

# Delivery used when neither the request nor the resolved voice specifies one.
default_instruct: "Warm, mature and composed, gently amused."

# Exposed verbatim via the `list_voices` action, in the kokoro-compatible shape
# {id, name, lang, gender}. `speaker` = the Qwen3 CustomVoice speaker that
# actually renders this voice; `instruct` = this voice's default delivery.
# English-capable voices are listed first (Anna is the default).
voices:
  - {id: anna,     name: Anna,     lang: English, gender: F, speaker: ono_anna, instruct: "Warm, mature and composed, gently amused."}
  - {id: ryan,     name: Ryan,     lang: English, gender: M, speaker: ryan,     instruct: "Confident, clear and friendly."}
  - {id: aiden,    name: Aiden,    lang: English, gender: M, speaker: aiden,    instruct: "Relaxed, warm and conversational."}
  - {id: sohee,    name: Sohee,    lang: English, gender: F, speaker: sohee,    instruct: "Bright, gentle and expressive."}
  - {id: serena,   name: Serena,   lang: Chinese, gender: F, speaker: serena,   instruct: "Warm and composed."}
  - {id: vivian,   name: Vivian,   lang: Chinese, gender: F, speaker: vivian,   instruct: "Lively and friendly."}
  - {id: uncle_fu, name: Uncle Fu, lang: Chinese, gender: M, speaker: uncle_fu, instruct: "Avuncular, steady and warm."}
  - {id: eric,     name: Eric,     lang: Chinese, gender: M, speaker: eric,     instruct: "Clear and measured."}
  - {id: dylan,    name: Dylan,    lang: Chinese, gender: M, speaker: dylan,    instruct: "Easygoing and upbeat."}

# Legacy Kokoro voice ids -> relayTTS voice ids. Lets clients (and any persisted
# voice preference) that still send Kokoro ids keep working as a true drop-in.
# Anything not matched here and not a known voice/speaker falls back to
# default_voice, so old prefs never error.
voice_aliases:
  af_heart: anna
  af_bella: anna
  af_alloy: anna
  af_aoede: anna
  af_nicole: sohee
  af_sarah: sohee
  bf_emma: anna
  bf_alice: anna
  am_michael: ryan
  am_adam: ryan
  am_eric: ryan
  am_onyx: aiden
  am_liam: aiden
  bm_george: aiden
  bm_daniel: aiden
